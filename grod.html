    // ------------------- 4. ФУНКЦИИ ДЛЯ МАРКЕРОВ -------------------
    function getMarkerColor(category) {
        const colors = { '0': '#b91c1c', '1': '#f97316', '2': '#1e88e5', '3': '#2b7a3e' };
        return colors[category] || '#6c757d';
    }

    function createCategoryIcon(category, color) {
        return L.divIcon({
            html: `<div style="background-color: ${color}; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-size: 14px; font-weight: bold; color: white;">${category}</div>`,
            className: 'custom-icon',
            iconSize: [32, 32],
            popupAnchor: [0, -14]
        });
    }

    let currentMarkers = [];

    function clearMarkers() {
        currentMarkers.forEach(marker => map.removeLayer(marker));
        currentMarkers = [];
    }

    function renderMarkers(filterCategory = 'all') {
        clearMarkers();
        const filtered = filterCategory === 'all' ? grodnoSights : grodnoSights.filter(s => s.category === filterCategory);
        filtered.forEach(sight => {
            const color = getMarkerColor(sight.category);
            const icon = createCategoryIcon(sight.category, color);
            const popupHtml = `
                <div style="min-width: 220px; max-width: 280px; font-family: 'Segoe UI', sans-serif;">
                    <h3 style="margin:0 0 6px 0; color:#1a4d2a; border-bottom:1px solid #ccc;">${sight.name}</h3>
                    <p style="margin:6px 0;"><strong>📅 Время:</strong> ${sight.date}</p>
                    <p style="margin:6px 0;"><strong>🏷 Категория:</strong> ${sight.category}</p>
                    <p style="margin:8px 0 4px 0; font-size:0.9rem;">${sight.description || '—'}</p>
                    <hr><small>📍 ${sight.lat.toFixed(4)}°, ${sight.lng.toFixed(4)}°</small>
                </div>
            `;
            const marker = L.marker([sight.lat, sight.lng], { icon: icon }).addTo(map);
            marker.bindPopup(popupHtml);
            marker.bindTooltip(sight.name, { permanent: false, direction: 'top', offset: [0, -16], opacity: 0.8 });
            currentMarkers.push(marker);
        });
        document.getElementById('stats').innerText = `Показано: ${filtered.length} из ${grodnoSights.length}`;
        if (filterCategory !== 'all') {
            map.openPopup(`<b>Фильтр: категория ${filterCategory}</b><br>Показано ${filtered.length} объектов`, map.getCenter(), { closeButton: true, autoClose: true });
        }
    }

    // ------------------- 5. ФИЛЬТР -------------------
    const filterButtons = document.querySelectorAll('.filter-btn');
    filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            filterButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMarkers(btn.getAttribute('data-cat'));
        });
    });

    // ------------------- 6. СТАРТОВАЯ ОТРИСОВКА -------------------
    renderMarkers('all');

    setTimeout(() => {
        map.openPopup(`<b>✅ Карта загружена!</b><br>${grodnoSights.length} историко-культурных ценностей<br>Используйте фильтр.`, map.getCenter(), { className: 'info-popup', closeButton: true });
    }, 800);
